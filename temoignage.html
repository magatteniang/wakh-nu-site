<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20rx='24'%20fill='%23C8553D'/%3E%3Cg%20transform='translate(13%2012)%20scale(.74)'%3E%3Cpath%20d='M30%208H70A22%2022%200%200%201%2092%2030V54A22%2022%200%200%201%2070%2076H52L26%2095L30%2076A22%2022%200%200%201%208%2054V30A22%2022%200%200%201%2030%208Z'%20fill='%23FBF6EF'/%3E%3Cpath%20d='M50%2062C50%2062%2030%2049%2030%2036C30%2028%2036%2023%2042%2023C46%2023%2049%2025%2050%2028C51%2025%2054%2023%2058%2023C64%2023%2070%2028%2070%2036C70%2049%2050%2062%2050%2062Z'%20fill='%23C8553D'/%3E%3C/g%3E%3C/svg%3E" />
<title>Témoignages — WAKH NÜ</title>
<meta name="description" content="Publie ton témoignage et lis ceux des autres sur WAKH NÜ, en toute bienveillance." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf6ef; --bg-alt:#f4ebdf; --panel:#ffffff; --text:#2a1f1a; --muted:#6f625a;
    --accent:#c8553d; --accent-dark:#a8412c; --accent-soft:#f6ded6; --green:#2f6f5e;
    --border:rgba(42,31,26,.12); --shadow:0 12px 40px rgba(60,35,20,.10);
  }
  :root[data-theme="dark"]{
    --bg:#15110f; --bg-alt:#1d1815; --panel:#221c19; --text:#f6ede4; --muted:#b3a498;
    --accent:#e8765d; --accent-dark:#f08a73; --accent-soft:#3a2520; --green:#6fc2a9;
    --border:rgba(255,255,255,.12); --shadow:0 12px 40px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;min-height:100vh;display:flex;flex-direction:column;
    font-family:'Poppins',system-ui,sans-serif;color:var(--text);background:var(--bg);line-height:1.65;
    transition:background .3s,color .3s;
  }
  h1,h2,h3{font-family:'Fraunces',Georgia,serif;margin:0;line-height:1.2}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
  .container{width:min(780px,100% - 32px);margin-inline:auto}

  /* Header */
  header{
    position:sticky;top:0;z-index:50;
    background:color-mix(in srgb,var(--bg) 85%,transparent);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
  }
  .nav{width:min(1100px,100% - 32px);margin-inline:auto;display:flex;align-items:center;justify-content:space-between;height:70px}
  .logo{font-family:'Fraunces',serif;font-weight:700;font-size:24px;text-decoration:none}
  .logo span{color:var(--accent)}
  .logo{display:inline-flex;align-items:center;gap:10px}
  .logo .wm{color:var(--text)}
  .logo .wm span{color:var(--accent)}
  .logo .mb{fill:var(--accent)}
  .logo .mh{fill:var(--bg)}
  .nav-right{display:flex;align-items:center;gap:8px}
  .nav-link{padding:8px 14px;border-radius:999px;text-decoration:none;font-weight:500;font-size:15px;color:var(--muted)}
  .nav-link:hover{background:var(--accent-soft);color:var(--accent-dark)}
  .icon-btn{
    position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:var(--panel);
    cursor:pointer;font-size:19px;display:grid;place-items:center;color:var(--text);text-decoration:none;
  }
  .badge{
    position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;
    background:var(--accent);color:#fff;font:600 11px/20px 'Poppins',sans-serif;text-align:center;
  }

  main{flex:1;padding:36px 0 60px}
  .page-title{font-size:clamp(30px,5vw,42px);margin-bottom:6px}
  .page-sub{color:var(--muted);margin:0 0 28px}

  /* Cards */
  .card{background:var(--panel);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);padding:26px}
  .composer h2{font-size:24px;margin-bottom:4px}
  .hint{margin:0 0 14px;font-size:14px;color:var(--muted)}
  label{display:block;font-size:14px;font-weight:500;margin:14px 0 6px}
  input[type=text],textarea{
    width:100%;padding:13px 16px;border-radius:14px;border:1.5px solid var(--border);
    background:var(--bg);color:var(--text);font:400 16px 'Poppins',sans-serif;transition:border-color .2s;
  }
  input[type=text]:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea{min-height:150px;resize:vertical}
  .btn{
    margin-top:18px;padding:13px 28px;border-radius:999px;border:0;cursor:pointer;
    background:var(--accent);color:#fff;font:600 16px 'Poppins',sans-serif;
    box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 35%,transparent);transition:.2s;
  }
  .btn:hover{background:var(--accent-dark);transform:translateY(-2px)}

  /* Feed */
  .feed{display:grid;gap:20px;margin-top:32px}
  .empty{text-align:center;color:var(--muted);padding:30px 10px}
  .post{animation:rise .5s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .author{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .ava{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-size:22px}
  .name{font-weight:600}
  .date{color:var(--muted);font-size:13px;margin-left:auto}
  .post h3{font-size:22px;margin-bottom:8px;overflow-wrap:anywhere}
  .body{margin:0;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--border)}
  .chip{
    padding:9px 16px;border-radius:999px;border:1.5px solid var(--border);background:transparent;color:var(--text);
    font:500 14px 'Poppins',sans-serif;cursor:pointer;transition:.2s;
  }
  .chip:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-dark)}
  .comments{margin-top:16px;display:grid;gap:10px}
  .comment{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:16px;padding:10px 14px}
  .comment .ava{width:30px;height:30px;font-size:16px;flex:none}
  .comment b{font-weight:600}
  .comment span.txt{overflow-wrap:anywhere}
  .comment-form{display:flex;gap:8px}
  .comment-form input{flex:1;min-width:0;padding:11px 14px}
  .comment-form button{
    padding:0 18px;border-radius:999px;border:0;background:var(--accent);color:#fff;font:600 14px 'Poppins',sans-serif;cursor:pointer;
  }

  /* Dialog */
  dialog{
    width:min(480px,calc(100% - 32px));border:1px solid var(--border);border-radius:24px;padding:24px;
    background:var(--panel);color:var(--text);box-shadow:var(--shadow);
  }
  dialog::backdrop{background:rgba(0,0,0,.5)}
  dialog h2{font-size:24px;margin-bottom:14px}
  .notif-list{max-height:55vh;overflow-y:auto;display:grid;gap:8px}
  .notif{padding:12px 14px;border-radius:14px;background:var(--bg);font-size:14px;overflow-wrap:anywhere}
  .notif.unread{border-left:4px solid var(--accent);font-weight:600}
  .notif small{display:block;color:var(--muted);font-weight:400}

  /* Toast */
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
    background:var(--text);color:var(--bg);padding:12px 22px;border-radius:999px;font-size:14px;font-weight:500;
    transition:.3s;z-index:100;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  footer{padding:30px 0;text-align:center;color:var(--muted);font-size:14px;border-top:1px solid var(--border)}

  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.post{animation:none}.btn,.chip,.toast{transition:none}}
  @media (max-width:640px){.nav-link.hide-sm{display:none}.date{margin-left:0;width:100%}.card{padding:20px}}
</style>
</head>
<body>

<header>
  <div class="nav">
    <a href="index.html" class="logo" aria-label="WAKH NÜ, retour à l'accueil"><svg viewBox="0 0 100 100" width="34" height="34" aria-hidden="true"><path class="mb" d="M30 8H70A22 22 0 0 1 92 30V54A22 22 0 0 1 70 76H52L26 95L30 76A22 22 0 0 1 8 54V30A22 22 0 0 1 30 8Z"/><path class="mh" d="M50 62C50 62 30 49 30 36C30 28 36 23 42 23C46 23 49 25 50 28C51 25 54 23 58 23C64 23 70 28 70 36C70 49 50 62 50 62Z"/></svg><span class="wm">WAKH <span>NÜ</span></span></a>
    <div class="nav-right">
      <a class="nav-link hide-sm" href="index.html">Accueil</a>
      <a class="nav-link" href="connexion.html" id="authLink">Connexion</a>
      <a class="icon-btn" id="avatarBtn" href="connexion.html" aria-label="Se connecter">👤</a>
      <button class="icon-btn" id="bellBtn" aria-label="Notifications" title="Notifications">🔔<span class="badge" id="badge" hidden>0</span></button>
      <button class="icon-btn" id="themeToggle" aria-label="Changer de thème clair/sombre" title="Thème clair / sombre">🌓</button>
    </div>
  </div>
</header>

<main>
  <div class="container">
    <h1 class="page-title">Témoignages</h1>
    <p class="page-sub">Partage ton histoire, lis celles des autres, réagis avec bienveillance.</p>

    <section class="card composer" aria-labelledby="composerTitle">
      <h2 id="composerTitle">Publier un témoignage</h2>
      <p class="hint" id="postingAs"></p>
      <form id="testimonialForm">
        <label for="title">Titre</label>
        <input type="text" id="title" maxlength="120" required />
        <label for="content">Ton témoignage</label>
        <textarea id="content" required></textarea>
        <button type="submit" class="btn">Publier</button>
      </form>
    </section>

    <section class="feed" id="list" aria-label="Liste des témoignages"></section>
  </div>
</main>

<footer>© <span id="year">2026</span> WAKH NÜ — Tous droits réservés.</footer>

<dialog id="notifDialog" aria-labelledby="notifTitle">
  <h2 id="notifTitle">Notifications</h2>
  <div class="notif-list" id="notifList"></div>
  <form method="dialog"><button class="btn" type="submit">Fermer</button></form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  // ---------- Thème ----------
  (function(){
    var root = document.documentElement, btn = document.getElementById('themeToggle');
    var saved = null;
    try { saved = localStorage.getItem('wakhnu_theme'); } catch(e){}
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    btn.addEventListener('click', function(){
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('wakhnu_theme', next); } catch(e){}
    });
  })();
  document.getElementById('year').textContent = new Date().getFullYear();

  // ---------- Outils ----------
  function $(id){ return document.getElementById(id); }
  function el(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text != null) e.textContent = text;   // textContent : le contenu des utilisateurs n'est jamais interprété comme du HTML
    return e;
  }
  function loadJSON(key, fallback){
    try{ var v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; }catch(e){ return fallback; }
  }
  function saveJSON(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); return true; }catch(e){ return false; }
  }
  function fmt(d){
    try{ return new Date(d).toLocaleString('fr-FR', {dateStyle:'medium', timeStyle:'short'}); }
    catch(e){ return ''; }
  }
  var toastTimer;
  function toast(text){
    var t = $('toast'); t.textContent = text; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2400);
  }

  // ---------- Données (stockage local, comme avant) ----------
  var testimonials = loadJSON('wahgnu_testimonials', []);
  var notifications = loadJSON('wahgnu_notifications', []);
  var users = loadJSON('wahgnu_users', []);
  var openComments = {};
  var focusComment = null;

  function me(){ var s = loadJSON('wahgnu_session', null); return s && s.pseudo ? s.pseudo : null; }
  function avatarOf(pseudo){
    var u = users.find(function(x){ return x.pseudo === pseudo; });
    return u && u.avatar ? u.avatar : '👤';
  }
  function saveAll(){ saveJSON('wahgnu_testimonials', testimonials); saveJSON('wahgnu_notifications', notifications); }

  // ---------- En-tête ----------
  function updateBadge(){
    var pseudo = me(), badge = $('badge');
    var n = pseudo ? notifications.filter(function(x){ return x.to === pseudo && !x.read; }).length : 0;
    badge.textContent = n;
    badge.hidden = n === 0;
  }
  function updateHeader(){
    var pseudo = me();
    var a = $('avatarBtn');
    a.textContent = pseudo ? avatarOf(pseudo) : '👤';
    a.setAttribute('href', pseudo ? 'profile.html' : 'connexion.html');
    a.setAttribute('aria-label', pseudo ? 'Mon profil' : 'Se connecter');
    var auth = $('authLink');
    auth.textContent = pseudo ? 'Déconnexion' : 'Connexion';
    auth.setAttribute('href', pseudo ? '#' : 'connexion.html');
    $('postingAs').textContent = pseudo
      ? 'Tu publies en tant que ' + pseudo + '.'
      : 'Tu publies en tant qu’Anonyme. Connecte-toi pour utiliser ton pseudo.';
    updateBadge();
  }
  $('authLink').addEventListener('click', function(e){
    if(me()){
      e.preventDefault();
      try{ localStorage.removeItem('wahgnu_session'); }catch(err){}
      toast('Déconnexion réussie ✅');
      updateHeader(); render();
    }
  });

  // ---------- Notifications ----------
  $('bellBtn').addEventListener('click', function(){
    var box = $('notifList'); box.textContent = '';
    var pseudo = me();
    if(!pseudo){
      box.appendChild(el('p','empty','Connecte-toi pour voir tes notifications.'));
    } else {
      var mine = notifications.filter(function(n){ return n.to === pseudo; });
      if(!mine.length) box.appendChild(el('p','empty','Aucune notification.'));
      mine.slice().reverse().forEach(function(n){
        var item = el('div', 'notif' + (n.read ? '' : ' unread'));
        item.appendChild(el('div','', n.message));
        item.appendChild(el('small','', fmt(n.date)));
        box.appendChild(item);
      });
      mine.forEach(function(n){ n.read = true; });
      saveAll(); updateBadge();
    }
    var dlg = $('notifDialog');
    if(typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open','');
  });

  function notify(to, message){
    notifications.push({to: to, message: message, date: new Date().toISOString(), read: false});
  }

  // ---------- Actions ----------
  function like(i){
    var t = testimonials[i]; if(!t) return;
    t.likes = (t.likes || 0) + 1;
    var liker = me() || 'Anonyme';
    if(t.author !== liker) notify(t.author, liker + ' a aimé votre post « ' + t.title + ' »');
    saveAll(); render(); updateBadge();
  }
  function addComment(i, text){
    text = text.trim();
    if(!text) return;
    var t = testimonials[i]; if(!t) return;
    var who = me() || 'Anonyme';
    t.comments = t.comments || [];
    t.comments.push({author: who, text: text});
    if(t.author !== who) notify(t.author, who + ' a commenté votre post « ' + t.title + ' » : « ' + text + ' »');
    openComments[i] = true; focusComment = i;
    saveAll(); render();
  }
  function repost(i){
    var t = testimonials[i]; if(!t) return;
    var copy = JSON.parse(JSON.stringify(t));
    copy.title = 'Repost : ' + t.title;
    copy.date = new Date().toISOString();
    testimonials.unshift(copy);
    openComments = {};
    saveAll(); render(); toast('Republié ✅');
  }

  // ---------- Affichage ----------
  function render(){
    var list = $('list'); list.textContent = '';
    if(!testimonials.length){
      list.appendChild(el('p','empty','Aucun témoignage pour le moment. Sois le premier à partager ton histoire 🌱'));
      return;
    }
    testimonials.forEach(function(t, i){
      var art = el('article','card post');

      var head = el('div','author');
      head.appendChild(el('span','ava', avatarOf(t.author)));
      head.appendChild(el('span','name', t.author || 'Anonyme'));
      head.appendChild(el('span','date', fmt(t.date)));
      art.appendChild(head);

      art.appendChild(el('h3','', t.title));
      art.appendChild(el('p','body', t.content));

      var actions = el('div','actions');
      var likeBtn = el('button','chip','👍 ' + (t.likes || 0));
      likeBtn.type = 'button';
      likeBtn.setAttribute('aria-label','J’aime (' + (t.likes || 0) + ')');
      likeBtn.addEventListener('click', function(){ like(i); });

      var count = (t.comments || []).length;
      var comBtn = el('button','chip','💬 Commentaires' + (count ? ' (' + count + ')' : ''));
      comBtn.type = 'button';
      comBtn.setAttribute('aria-expanded', openComments[i] ? 'true' : 'false');
      comBtn.addEventListener('click', function(){
        openComments[i] = !openComments[i];
        if(openComments[i]) focusComment = i;
        render();
      });

      var repBtn = el('button','chip','🔄 Republier');
      repBtn.type = 'button';
      repBtn.addEventListener('click', function(){ repost(i); });

      actions.appendChild(likeBtn); actions.appendChild(comBtn); actions.appendChild(repBtn);
      art.appendChild(actions);

      if(openComments[i]){
        var box = el('div','comments');
        (t.comments || []).forEach(function(c){
          var row = el('div','comment');
          row.appendChild(el('span','ava', avatarOf(c.author)));
          var txt = el('span','txt');
          txt.appendChild(el('b','', (c.author || 'Anonyme') + ' : '));
          txt.appendChild(document.createTextNode(c.text));
          row.appendChild(txt);
          box.appendChild(row);
        });
        var form = el('form','comment-form');
        var input = el('input'); input.type = 'text'; input.placeholder = 'Ajouter un commentaire…';
        input.setAttribute('aria-label','Ajouter un commentaire'); input.maxLength = 500;
        var send = el('button','','Envoyer'); send.type = 'submit';
        form.appendChild(input); form.appendChild(send);
        form.addEventListener('submit', function(e){ e.preventDefault(); addComment(i, input.value); });
        box.appendChild(form);
        art.appendChild(box);
        if(focusComment === i){ setTimeout(function(){ input.focus(); }, 0); focusComment = null; }
      }
      list.appendChild(art);
    });
  }

  // ---------- Publication ----------
  $('testimonialForm').addEventListener('submit', function(e){
    e.preventDefault();
    var title = $('title').value.trim();
    var content = $('content').value.trim();
    if(!title || !content) return;
    testimonials.unshift({
      title: title, content: content, date: new Date().toISOString(),
      likes: 0, comments: [], author: me() || 'Anonyme'
    });
    openComments = {};
    if(!saveJSON('wahgnu_testimonials', testimonials)){ toast('Impossible d’enregistrer sur cet appareil.'); return; }
    $('title').value = ''; $('content').value = '';
    render(); toast('Témoignage publié ✅');
  });

  updateHeader();
  render();
</script>
</body>
</html>
